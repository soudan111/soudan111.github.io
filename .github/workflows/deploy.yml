name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io
  # "/" when the repo is named <account>.github.io (a user site),
  # otherwise "/<repo-name>" (a project site).
  BASE_PATH: ${{ github.repository == format('{0}/{0}.github.io', github.repository_owner) && '/' || format('/{0}', github.event.repository.name) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
